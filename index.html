<style>
  :root { --brand:#00e6a0; --brand-deep:#00cc88; --brand-soft:#02a20; --bg:#05100c; --node:#d9fff0; --scale:1.48;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  html,body { height:100%; margin:0; background:var(--bg); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center;
    background: radial-gradient(50% 50% at 50% 50%, var(--brand-soft) 0%, var(--bg) 100%); }
  .wrap { flex:none; width:calc(min(88vw,88vh) * var(--scale)); aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  svg { width:100%; height:100%; overflow:visible; shape-rendering:geometricPrecision;
     }
  .nodes circle { fill:var(--node); }
  .lines polyline { fill:none; stroke:var(--brand); stroke-width:0.5; stroke-linecap:round; stroke-linejoin:round; filter: box-shadow:0 0 100px rgba(0,230,10,.5)); opacity: 0.3;}

  /* Intro: rocket rises from the bottom while the grid fades in */
  :root { --intro:2s; }
  .lines, .nodes, #pulses { animation:gridIn var(--intro) ease-in-out both; }
  @keyframes gridIn { from{opacity:0} to{opacity:1} }

  .rise  { animation:rise var(--intro) cubic-bezier(.25,.46,.45,.94) both; }
  @keyframes rise { from{transform:translateY(2400px)} to{transform:translateY(0)} }

  /* After arrival: engine shake, up and down, forever */
  .shake { animation:shake 1s ease-in-out infinite; animation-delay:var(--intro); }
  @keyframes shake { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-4px)} 75%{transform:translateY(4px)} }

  /* Flame burns the whole time */
  .flame { transform-box:fill-box; transform-origin:50% 0%; }
  .f1 { animation:flick1 .16s ease-in-out infinite; }
  .f2 { animation:flick2 .12s ease-in-out infinite; }
  .f3 { animation:flick3 .09s ease-in-out infinite; }
  @keyframes flick1 { 0%,100%{transform:scale(1,1)}   35%{transform:scale(.93,1.16)} 70%{transform:scale(1.06,.86)} }
  @keyframes flick2 { 0%,100%{transform:scale(1,1)}   40%{transform:scale(.92,1.18)} 75%{transform:scale(1.07,.84)} }
  @keyframes flick3 { 0%,100%{transform:scale(1,1)}   30%{transform:scale(.9,1.2)}   65%{transform:scale(1.08,.82)} }

  @media (prefers-reduced-motion: reduce){
    .lines,.nodes,#pulses,.rise,.shake,.f1,.f2,.f3{animation:none}
  }

  /* Emote in the rocket window: clipped to the glass, so it only ever shows inside the window */
  .wicon { color:#fff; }
  .wicon.like  { color:#1877f2; }
  .wicon.heart { color:#ff3b5c; }
  .wicon .em, .wicon .em * { transform-box:fill-box; transform-origin:center; }
  .wicon.like .em { transform-origin:30% 85%; }
  .tongue { transform-origin:50% 0 !important; }
  #wCount { font:700 8px/1 system-ui,-apple-system,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums; fill:#eafff4; opacity:0; }

  /* In-window animations: play while the emote is held up */
  .wicon.like.play .em     { animation:likeTilt .8s ease-out; }
  .wicon.heart.play .em    { animation:beat .8s ease-in-out; }
  .wicon.comment.play .dot { animation:dotUp .6s ease-in-out; }
  .wicon.comment.play .d2 { animation-delay:.1s; } .wicon.comment.play .d3 { animation-delay:.2s; }
  .wicon.follow.play .badge { animation:badgePop .8s ease-out; }
  .wicon.money.play .em    { animation:flutter .9s ease-in-out; }
  .wicon.face.play .em     { animation:squash .7s ease-in-out; }
  .wicon.face.play .tongue { animation:wag .7s ease-in-out; }
  .wicon.face.play .eye    { animation:eyePop .7s ease-in-out; }
  .wicon.bank.play .em     { animation:bounce .8s ease-out; }
  .wicon.cool.play .shades { animation:drop .8s cubic-bezier(.3,1.4,.5,1); }
  .spark { opacity:0; }
  .wicon.cool.play .spark  { animation:spark .8s ease-out .35s; }

  @keyframes likeTilt { 0%{transform:rotate(0) scale(1)} 30%{transform:rotate(-28deg) scale(1.28)} 60%{transform:rotate(8deg) scale(1.1)} 100%{transform:rotate(0) scale(1)} }
  @keyframes beat { 0%,100%{transform:scale(1)} 22%{transform:scale(1.38)} 42%{transform:scale(1)} 62%{transform:scale(1.26)} 80%{transform:scale(1)} }
  @keyframes dotUp { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-3.5px)} }
  @keyframes badgePop { 0%{transform:scale(1) rotate(0)} 40%{transform:scale(1.7) rotate(120deg)} 100%{transform:scale(1) rotate(180deg)} }
  @keyframes flutter { 0%,100%{transform:rotate(0) translateY(0)} 20%{transform:rotate(-12deg) translateY(-4px)} 45%{transform:rotate(10deg) translateY(-2px)} 70%{transform:rotate(-6deg) translateY(-3px)} }
  @keyframes squash { 0%,100%{transform:scale(1)} 30%{transform:scale(1.12,.88)} 60%{transform:scale(.94,1.1)} }
  @keyframes wag { 0%,100%{transform:rotate(0) scaleY(1)} 25%{transform:rotate(22deg) scaleY(1.35)} 55%{transform:rotate(-22deg) scaleY(1.35)} 80%{transform:rotate(8deg)} }
  @keyframes eyePop { 0%,100%{transform:scale(1)} 40%{transform:scale(1.4)} }
  @keyframes bounce { 0%,100%{transform:translateY(0) scale(1)} 25%{transform:translateY(-7px) scale(.96,1.06)} 50%{transform:translateY(0) scale(1.06,.92)} 72%{transform:translateY(-3px)} }
  @keyframes drop { 0%{transform:translateY(-14px);opacity:0} 45%{opacity:1} 65%{transform:translateY(2px)} 85%{transform:translateY(-1px)} 100%{transform:translateY(0);opacity:1} }
  @keyframes spark { 0%{opacity:0;transform:scale(0) rotate(0)} 50%{opacity:1;transform:scale(1.3) rotate(45deg)} 100%{opacity:0;transform:scale(.5) rotate(90deg)} }
  @media (prefers-reduced-motion: reduce){ .wicon.play .em, .wicon.play * { animation:none !important; } }

  .logo { position:fixed; z-index:5; left:50%; transform:translateX(-50%); pointer-events:none;
    top:calc(env(safe-area-inset-top,0px) + 14px); width:clamp(220px,68vw,325px);
    animation:gridIn var(--intro) ease-in-out both; }
  .logo svg { display:block; width:100%; height:auto; overflow:visible; }
  @media (prefers-reduced-motion: reduce){ .logo{animation:none} }
.spinner-row {
  position: absolute;
  bottom: 48px;
  display: flex;
  gap: 6px;
  opacity: 0;
  animation: loaderFadeIn .6s ease 4s forwards;
}

@keyframes loaderFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.spinner-row span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #00cc88;
  opacity: 0.35;
  animation: pulse 1.2s ease-in-out infinite;
}

.spinner-row span:nth-child(2) {
  animation-delay: 0.15s;
}

.spinner-row span:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes pulse {
  0%, 100% {
    opacity: 0.35;
    transform: scale(1);
  }

  50% {
    opacity: 1;
    transform: scale(1.3);
  }
}
</style>

<script type="module">
import { account, getUserProfile } from "./lib/appwrite-config.js";

/* splash: stay 17s, then go by session (valid -> own dashboard, none/expired -> intro.html); the check starts
   immediately so the answer is ready */
const SPLASH_MS = 17000;
const DASH = {
  client: "client-dashboard.html",
  earner: "earner-dashboard.html",
  admin:  "admin-dashboard.html",
  owner:  "platform-space.html"
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function whereTo() {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const user = await account.get();                          // throws 401 when there is no valid session
      try {
        const profile = await getUserProfile(user.$id);
        const role = String(profile.role || "");
        if (DASH[role]) return DASH[role];
        if (role === "pending_admin") return "login.html";       // login page explains it and signs that session out
        return "no_access.html";
      } catch (e) {
        if (e && e.code === 404) return "no_access.html";        // signed in, but no profile
        return "login.html";                                     // profile lookup hiccup: the login page re-checks the session
      }
    } catch (e) {
      if (e && e.code === 401) return "intro.html";              // not signed in
      if (attempt === 0) await sleep(1500);                      // network blip: try once more
    }
  }
  return "intro.html";
}

const target = whereTo();
const started = performance.now();
setTimeout(async () => {
  const dest = await Promise.race([target, sleep(8000).then(() => "intro.html")]);   // never hang on a dead connection
  window.location.replace(dest);
}, SPLASH_MS);
</script>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg",
      SIZE=34, CSIZE=26, LIFT=5, D=2600, idx=0, busy=false;

  var stock=[].slice.call(document.querySelectorAll(".stock .react")),
      host=document.getElementById("wHost"),
      em=document.getElementById("wEm"),
      move=document.getElementById("wMove"),
      moveC=document.getElementById("wMoveC"),
      cnt=document.getElementById("wCount"),
      reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;


  function next(){
    if(!busy) launch(idx++%stock.length);
  }

  function launch(k){
    if(reduce || busy || !stock.length) return;

    busy=true;

    var src=stock[k],
        svg=src.querySelector("svg"),
        w=svg.viewBox.baseVal.width||24,
        h=svg.viewBox.baseVal.height||24;

    var counted=src.matches(".like,.heart,.comment,.follow"),
        s=(counted?CSIZE:SIZE)/w;

    var g=document.createElementNS(NS,"g");

    g.setAttribute(
      "transform",
      "translate("+(-w*s/2)+" "+(-h*s/2)+") scale("+s+")"
    );

    [].forEach.call(svg.childNodes,function(n){
      g.appendChild(n.cloneNode(true));
    });

    em.appendChild(g);

    if(counted){
      var bb=g.getBBox();

      g.setAttribute(
        "transform",
        "translate("+
        (-(bb.x+bb.width/2)*s)+
        " "+
        (-LIFT-(bb.y+bb.height/2)*s)+
        ") scale("+s+")"
      );
    }

    host.setAttribute(
      "class",
      "wicon "+
      [].filter.call(src.classList,function(c){
        return c!=="react";
      }).join(" ")
    );

    function kf(rot){
      return [
        {
          offset:0,
          transform:"translateY(46px) scale(.85) rotate(0deg)",
          easing:"cubic-bezier(.2,.75,.3,1)"
        },
        {
          offset:.22,
          transform:"translateY(-3px) scale(1.06) rotate(0deg)",
          easing:"ease-in-out"
        },
        {
          offset:.30,
          transform:"translateY(0) scale(1) rotate(0deg)"
        },
        {
          offset:.72,
          transform:"translateY(0) scale(1) rotate(0deg)",
          easing:"cubic-bezier(.55,0,.9,.5)"
        },
        {
          offset:.95,
          transform:"translateY(46px) scale(.85) rotate("+rot+"deg)"
        },
        {
          offset:1,
          transform:"translateY(46px) scale(.85) rotate("+rot+"deg)"
        }
      ];
    }

    var a=move.animate(kf(360),{
      duration:D,
      fill:"both"
    });

    var ac=moveC.animate(kf(0),{
      duration:D,
      fill:"both"
    });

    setTimeout(function(){
      host.classList.add("play");
    },D*.30);

    var ca=null;

    if(src.matches(".like,.heart,.comment,.follow")){
      cnt.textContent="130";

      ca=cnt.animate(
        [{opacity:1},{opacity:1}],
        {duration:D,fill:"both"}
      );

      var t0=performance.now();

      requestAnimationFrame(function f(now){
        var p=Math.max(
          0,
          Math.min(1,(now-t0)/(D*.92))
        );

        cnt.textContent=Math.round(130+370*p);

        if(now-t0<D*.9){
          requestAnimationFrame(f);
        }
      });
    }

    setTimeout(function(){
      a.cancel();
      ac.cancel();

      if(ca) ca.cancel();

      em.textContent="";
      host.setAttribute("class","wicon");
      cnt.textContent="";
      busy=false;
    },D);
  }

  if(reduce) return;

  setTimeout(function loop(){
    if(!document.hidden) next();
    setTimeout(loop,200);
  },2200);

})();
</script>
<script>
(function(){
  var C=4, M=24, PAD=44, NS="http://www.w3.org/2000/svg";
  var BEND=0.5, START=0.4, F=6; // flat middle, ends curl back
  var lines=document.getElementById("lines"), nodes=document.getElementById("nodes"), pulses=document.getElementById("pulses");
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function lens(gx,gy){
    var u=gx/C*2-1, v=gy/C*2-1;
    var ex=Math.max(0,(Math.abs(u)-START)/(1-START)), ey=Math.max(0,(Math.abs(v)-START)/(1-START));
    var s=F/(F+BEND*(ex*ex+ey*ey));
    return {x:u*s, y:v*s};
  }
  // Only the interior lines (1..C-1) exist; no outer frame lines
  var lo=1e9,hi=-1e9;
  for(var a=1;a<C;a++)for(var t=0;t<=C*M;t++){
    var q=t/M, p1=lens(a,q), p2=lens(q,a);
    lo=Math.min(lo,p1.x,p1.y,p2.x,p2.y);hi=Math.max(hi,p1.x,p1.y,p2.x,p2.y);
  }
  var sc=(400-PAD*2)/(hi-lo), mid=(hi+lo)/2;
  function pos(gx,gy){var p=lens(gx,gy);return {x:200+(p.x-mid)*sc,y:200+(p.y-mid)*sc};}
  function fmt(pts){return pts.map(function(p){return p.x.toFixed(2)+","+p.y.toFixed(2);}).join(" ");}
  var i,j,s,pts;
  for(a=1;a<C;a++){
    pts=[];for(s=0;s<=C*M;s++)pts.push(pos(s/M,a));lines.appendChild(el("polyline",{points:fmt(pts)}));
    pts=[];for(s=0;s<=C*M;s++)pts.push(pos(a,s/M));lines.appendChild(el("polyline",{points:fmt(pts)}));
  }
  for(i=1;i<C;i++)for(j=1;j<C;j++){var n=pos(i,j);nodes.appendChild(el("circle",{cx:n.x,cy:n.y,r:1}));}
})();
</script>
