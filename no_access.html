<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  /* css/pages.css is not in the project, so this page carries its own small stylesheet. */
  *{ box-sizing:border-box; }
  html, body{ margin:0; min-height:100%; }
  body.centered{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); color:var(--text); font-family:'Sora', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .box{ width:100%; max-width:380px; text-align:center; padding:34px 26px 28px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); }
  .icon{ width:64px; height:64px; margin:0 auto 18px; border-radius:20px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--danger) 14%, transparent); }
  .icon svg{ width:30px; height:30px; fill:none; stroke:var(--danger); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  h2{ margin:0 0 8px; font-family: system-ui, sans-serif; font-size:22px; font-weight:700; }
  p{ margin:0 0 22px; font-size:13.5px; line-height:1.6; color:var(--text-dim); }
  button{ width:100%; padding:13px 16px; border:0; border-radius:var(--radius-sm); cursor:pointer; font:700 14px 'Sora', system-ui, sans-serif; color:#04140d; background:linear-gradient(135deg, var(--brand), var(--brand-deep)); }
  button:active{ transform:scale(.98); }
</style>
</head>
<body class="centered">

  <div class="box">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>Access Denied</h2>
    <p>You do not have permission to access this dashboard.</p>

    <button onclick="logout()">Logout</button>
  </div>

<script type="module">
  import { account } from "./lib/appwrite-config.js";

  if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

  // logout is global so the button can call it
  window.logout = function() {
    account.deleteSession("current")
      .then(() => {
        window.location.href = "login.html";
      })
      .catch((error) => {
        console.error("Logout error:", error);
        window.location.href = "login.html";
      });
  };
</script>
</body>
</html>
